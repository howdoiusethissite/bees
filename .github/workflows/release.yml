name: Release

# Builds the mod and publishes the jar as a GitHub release tagged v<version> (version from gradle.properties).
# Runs when a version bump lands on main, or by hand from the Actions tab on any branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [gradle.properties]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-configuration-cache

      - name: Read version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hivemind ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/libs/hivemind-${{ steps.version.outputs.version }}.jar
